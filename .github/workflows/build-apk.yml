name: Build CardLens APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack CardLens
        run: unzip -oq CardLens-APKIt-Ready.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
                - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CardLens-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
